[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-validation"
version = "0.1.0"
description = "Turn structured and unstructured financial information into trustworthy, validated inputs for AI systems (synthetic data only)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
